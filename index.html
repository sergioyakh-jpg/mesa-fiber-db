<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESA Fiber Solutions - ERP System</title>
    
    <!-- Tailwind CSS (Framework UI) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Icone) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .module-enter { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ROOT CONTAINER PER L'APP (Viene popolato da JavaScript) -->
    <div id="app-root" class="flex-1 flex flex-col w-full h-full"></div>

    <!-- NOTIFICHE TOAST -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        /********************************************************
         * 1. DATABASE E GESTIONE STATO (DATA ACCESS LAYER)
         * Standard: Async/Await, disaccoppiato dalla UI.
         ********************************************************/
        const Database = {
            storageKey: 'mesa_erp_database',
            
            // Dati di default per il primo avvio
            defaultData: {
                users: [
                    { id: 'U1', name: "Serhiy Yakh'yayev", username: "admin", pass: "admin123", role: "Admin", email: "admin@mesafiber.it" },
                    { id: 'U2', name: "Mariya", username: "manager", pass: "manager123", role: "Manager", email: "manager@mesafiber.it" },
                    { id: 'U3', name: "Marco Tecnico", username: "tecnico", pass: "tecnico123", role: "Tecnico", email: "tecnico@mesafiber.it" }
                ],
                tasks: [
                    { id: "TSK-001", type: "Delivery", address: "Via Emilia Est 100, Modena", priority: "Alta", status: "Aperto", assignedTo: "U3", description: "Attivazione FTTH, test borchia ottica." }
                ],
                inventory: [
                    { id: "INV-001", item: "Bretella Ottica SC/APC", quantity: 50, threshold: 10 }
                ],
                fleet: [
                    { id: "VEH-001", model: "Peugeot Partner", plate: "AB123CD", assignedTo: "U3", status: "Operativo" }
                ],
                settings: {
                    ghOwner: "", ghRepo: "", ghToken: ""
                }
            },

            async init() {
                let data = localStorage.getItem(this.storageKey);
                if (!data) {
                    await this.saveAll(this.defaultData);
                }
            },

            async getAll() {
                return JSON.parse(localStorage.getItem(this.storageKey));
            },

            async saveAll(data) {
                localStorage.setItem(this.storageKey, JSON.stringify(data));
                await this.syncToGitHub(data); // Tenta il sync in background
            },

            // Utility sicura per codificare Base64 (risolve il problema del JSON vuoto su GitHub)
            encodeBase64(str) {
                return btoa(new TextEncoder().encode(str).reduce((data, byte) => data + String.fromCharCode(byte), ''));
            },

            async syncToGitHub(data) {
                const settings = data.settings;
                if (!settings || !settings.ghToken || !settings.ghOwner || !settings.ghRepo) return;

                const url = `https://api.github.com/repos/${settings.ghOwner}/${settings.ghRepo}/contents/database.json`;
                
                try {
                    // 1. Cerca il file per ottenere l'hash (SHA) necessario per l'aggiornamento
                    let sha = undefined;
                    const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${settings.ghToken}` } });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        sha = fileData.sha;
                    }

                    // 2. Prepara e invia il nuovo file
                    const jsonString = JSON.stringify(data, null, 2);
                    const encodedContent = this.encodeBase64(jsonString);

                    const putRes = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${settings.ghToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: "Sync Database MESA ERP",
                            content: encodedContent,
                            sha: sha
                        })
                    });

                    if (!putRes.ok) throw new Error("Errore GitHub API");
                    console.log("Sincronizzazione GitHub completata.");
                } catch (error) {
                    console.error("Fallimento sync GitHub:", error);
                    Toast.show("Errore di sincronizzazione Cloud", "error");
                }
            }
        };

        /********************************************************
         * 2. SISTEMA DI AUTENTICAZIONE E SESSIONE
         ********************************************************/
        const Auth = {
            get currentUser() {
                const user = localStorage.getItem('mesa_session');
                return user ? JSON.parse(user) : null;
            },
            async login(username, password) {
                const db = await Database.getAll();
                const user = db.users.find(u => u.username === username && u.pass === password);
                if (user) {
                    localStorage.setItem('mesa_session', JSON.stringify(user));
                    return true;
                }
                return false;
            },
            logout() {
                localStorage.removeItem('mesa_session');
                App.navigate('login');
            },
            // Controllo permessi
            hasRole(rolesArray) {
                if (!this.currentUser) return false;
                return rolesArray.includes(this.currentUser.role);
            }
        };

        /********************************************************
         * 3. COMPONENTI UI & NOTIFICHE
         ********************************************************/
        const Toast = {
            show(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const color = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
                toast.className = `${color} text-white px-4 py-2 rounded shadow-lg text-sm flex items-center gap-2 module-enter`;
                toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-triangle-exclamation'}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => { toast.remove(); }, 3000);
            }
        };

        // Generatore Form Universale
        const FormBuilder = {
            createField(field) {
                return `
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">${field.label}</label>
                        ${field.type === 'select' 
                            ? `<select id="${field.id}" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-blue-500 focus:outline-none text-sm">
                                ${field.options.map(o => `<option value="${o.value}">${o.text}</option>`).join('')}
                               </select>`
                            : field.type === 'textarea'
                            ? `<textarea id="${field.id}" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="${field.placeholder || ''}"></textarea>`
                            : `<input type="${field.type}" id="${field.id}" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-blue-500 focus:outline-none text-sm" placeholder="${field.placeholder || ''}">`
                        }
                    </div>
                `;
            }
        };

        /********************************************************
         * 4. CORE APPLICATION (ROUTER E RENDERING)
         ********************************************************/
        const App = {
            root: document.getElementById('app-root'),
            
            async start() {
                await Database.init();
                if (Auth.currentUser) {
                    this.navigate('dashboard');
                } else {
                    this.navigate('login');
                }
            },

            async navigate(route) {
                this.root.innerHTML = ''; // Pulisci la vista
                const db = await Database.getAll();

                if (route === 'login') return Views.renderLogin();
                
                // Se non sei loggato, forza il login
                if (!Auth.currentUser) return this.navigate('login');

                // Struttura Base App (Header + Main)
                this.root.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigate('dashboard')">
                            <div class="w-10 h-10 rounded bg-blue-600 flex items-center justify-center font-bold text-white shadow">M</div>
                            <div>
                                <h1 class="font-bold text-lg leading-tight">MESA Fiber</h1>
                                <p class="text-xs text-slate-400">ERP System</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right hidden sm:block">
                                <div class="text-sm font-bold">${Auth.currentUser.name}</div>
                                <div class="text-xs text-blue-400">${Auth.currentUser.role}</div>
                            </div>
                            <button onclick="Auth.logout()" class="w-10 h-10 rounded bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-red-400 transition">
                                <i class="fa-solid fa-power-off"></i>
                            </button>
                        </div>
                    </header>
                    <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-7xl mx-auto w-full module-enter"></main>
                `;

                const main = document.getElementById('main-content');

                // Router logico e controllo permessi
                switch(route) {
                    case 'dashboard': Views.renderDashboard(main, db); break;
                    case 'tasks': Views.renderTasks(main, db); break;
                    case 'magazzino': 
                        if (Auth.hasRole(['Admin', 'Manager'])) Views.renderInventory(main, db); 
                        else this.forbidden(main);
                        break;
                    case 'flotta': 
                        Views.renderFleet(main, db); 
                        break;
                    case 'utenti':
                        if (Auth.hasRole(['Admin'])) Views.renderUsers(main, db);
                        else this.forbidden(main);
                        break;
                    case 'impostazioni':
                        if (Auth.hasRole(['Admin'])) Views.renderSettings(main, db);
                        else this.forbidden(main);
                        break;
                    default: this.navigate('dashboard');
                }
            },

            forbidden(container) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <i class="fa-solid fa-lock text-5xl text-slate-600 mb-4"></i>
                        <h2 class="text-xl font-bold text-white">Accesso Negato</h2>
                        <p class="text-slate-400 mt-2">Il tuo ruolo (${Auth.currentUser.role}) non ha i permessi per questa sezione.</p>
                        <button onclick="App.navigate('dashboard')" class="mt-6 px-4 py-2 bg-blue-600 rounded text-sm font-semibold">Torna alla Home</button>
                    </div>
                `;
            }
        };

        /********************************************************
         * 5. VISTE (VIEWS) MODULARI
         ********************************************************/
        const Views = {
            // -- SCHERMATA LOGIN --
            renderLogin() {
                App.root.innerHTML = `
                    <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-8 shadow-2xl">
                            <div class="text-center mb-8">
                                <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-4 shadow-lg shadow-blue-900/50"><i class="fa-solid fa-network-wired"></i></div>
                                <h1 class="text-2xl font-bold">MESA Fiber Solutions</h1>
                                <p class="text-sm text-slate-400 mt-1">Accesso Sistema ERP</p>
                            </div>
                            <form id="frm-login" class="space-y-4">
                                ${FormBuilder.createField({id: 'log-user', label: 'Username', type: 'text', placeholder: 'Inserisci username'})}
                                ${FormBuilder.createField({id: 'log-pass', label: 'Password', type: 'password', placeholder: '••••••••'})}
                                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded font-bold transition">Accedi</button>
                            </form>
                            <div class="mt-6 p-3 bg-slate-800 rounded text-xs text-slate-400">
                                <b>Ruoli di test:</b><br>Admin: admin/admin123<br>Manager: manager/manager123<br>Tecnico: tecnico/tecnico123
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('frm-login').onsubmit = async (e) => {
                    e.preventDefault();
                    const success = await Auth.login(document.getElementById('log-user').value, document.getElementById('log-pass').value);
                    if (success) App.navigate('dashboard');
                    else Toast.show('Credenziali errate', 'error');
                };
            },

            // -- DASHBOARD PRINCIPALE --
            renderDashboard(container, db) {
                const isTech = Auth.currentUser.role === 'Tecnico';
                
                container.innerHTML = `
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold">Benvenuto, ${Auth.currentUser.name}</h2>
                        <p class="text-slate-400 text-sm">Seleziona un modulo operativo per iniziare.</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Modulo Pratiche (Tutti) -->
                        <div onclick="App.navigate('tasks')" class="bg-slate-800 border border-slate-700 rounded-xl p-6 cursor-pointer hover:border-blue-500 transition group">
                            <i class="fa-solid fa-list-check text-3xl text-blue-400 mb-4 group-hover:scale-110 transition"></i>
                            <h3 class="text-lg font-bold">Gestione Pratiche</h3>
                            <p class="text-sm text-slate-400 mt-1">${isTech ? 'Vedi i tuoi interventi assegnati.' : 'Crea e assegna pratiche Delivery/Assurance.'}</p>
                        </div>

                        <!-- Modulo Flotta (Tutti) -->
                        <div onclick="App.navigate('flotta')" class="bg-slate-800 border border-slate-700 rounded-xl p-6 cursor-pointer hover:border-blue-500 transition group">
                            <i class="fa-solid fa-truck text-3xl text-indigo-400 mb-4 group-hover:scale-110 transition"></i>
                            <h3 class="text-lg font-bold">Flotta Mezzi</h3>
                            <p class="text-sm text-slate-400 mt-1">${isTech ? 'Vedi il mezzo a te assegnato.' : 'Gestisci assegnazioni furgoni.'}</p>
                        </div>

                        <!-- Modulo Magazzino (Admin, Manager) -->
                        ${!isTech ? `
                        <div onclick="App.navigate('magazzino')" class="bg-slate-800 border border-slate-700 rounded-xl p-6 cursor-pointer hover:border-blue-500 transition group">
                            <i class="fa-solid fa-boxes-stacked text-3xl text-amber-400 mb-4 group-hover:scale-110 transition"></i>
                            <h3 class="text-lg font-bold">Magazzino</h3>
                            <p class="text-sm text-slate-400 mt-1">Controllo inventario e soglie scorte.</p>
                        </div>
                        ` : ''}

                        <!-- Modulo Utenti (Solo Admin) -->
                        ${Auth.hasRole(['Admin']) ? `
                        <div onclick="App.navigate('utenti')" class="bg-slate-800 border border-slate-700 rounded-xl p-6 cursor-pointer hover:border-blue-500 transition group">
                            <i class="fa-solid fa-users text-3xl text-emerald-400 mb-4 group-hover:scale-110 transition"></i>
                            <h3 class="text-lg font-bold">Personale</h3>
                            <p class="text-sm text-slate-400 mt-1">Gestisci dipendenti e credenziali.</p>
                        </div>
                        
                        <!-- Modulo Impostazioni Database -->
                        <div onclick="App.navigate('impostazioni')" class="bg-slate-800 border border-slate-700 rounded-xl p-6 cursor-pointer hover:border-blue-500 transition group">
                            <i class="fa-solid fa-database text-3xl text-slate-400 mb-4 group-hover:scale-110 transition"></i>
                            <h3 class="text-lg font-bold">Database Cloud</h3>
                            <p class="text-sm text-slate-400 mt-1">Configura GitHub Sync e Backup.</p>
                        </div>
                        ` : ''}
                    </div>
                `;
            },

            // -- GESTIONE PRATICHE (TASKS) --
            renderTasks(container, db) {
                const user = Auth.currentUser;
                // I tecnici vedono solo le loro pratiche, Manager e Admin vedono tutto
                const visibleTasks = user.role === 'Tecnico' ? db.tasks.filter(t => t.assignedTo === user.id) : db.tasks;

                container.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <div>
                            <button onclick="App.navigate('dashboard')" class="text-sm text-slate-400 hover:text-white mb-2"><i class="fa-solid fa-arrow-left"></i> Torna alla Dashboard</button>
                            <h2 class="text-2xl font-bold">Gestione Pratiche</h2>
                        </div>
                        ${Auth.hasRole(['Admin', 'Manager']) ? `
                        <button onclick="Views.modals.newTask(${JSON.stringify(db.users).replace(/"/g, '&quot;')})" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-bold shadow"><i class="fa-solid fa-plus mr-2"></i>Nuova Pratica</button>
                        ` : ''}
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-x-auto shadow">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-700">
                                <tr>
                                    <th class="p-4 font-semibold">ID Pratica</th>
                                    <th class="p-4 font-semibold">Tipo / Indirizzo</th>
                                    <th class="p-4 font-semibold">Assegnato A</th>
                                    <th class="p-4 font-semibold">Stato</th>
                                    <th class="p-4 font-semibold text-right">Azioni</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
                                ${visibleTasks.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-slate-500">Nessuna pratica trovata.</td></tr>` : 
                                  visibleTasks.map(t => {
                                      const techName = db.users.find(u => u.id === t.assignedTo)?.name || 'Nessuno';
                                      const statusColor = t.status === 'Risolto' ? 'bg-emerald-500/20 text-emerald-400' : (t.status === 'In Lavorazione' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-600/50 text-slate-300');
                                      return `
                                      <tr class="hover:bg-slate-700/50 transition">
                                          <td class="p-4 font-mono font-bold">${t.id}</td>
                                          <td class="p-4">
                                            <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded mr-2">${t.type}</span>${t.address}
                                          </td>
                                          <td class="p-4 text-slate-300">${techName}</td>
                                          <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${t.status}</span></td>
                                          <td class="p-4 text-right">
                                            <select onchange="updateTaskStatus('${t.id}', this.value)" class="bg-slate-900 border border-slate-600 rounded text-xs p-1 focus:outline-none">
                                                <option value="Aperto" ${t.status === 'Aperto' ? 'selected' : ''}>Aperto</option>
                                                <option value="In Lavorazione" ${t.status === 'In Lavorazione' ? 'selected' : ''}>In Lavorazione</option>
                                                <option value="Risolto" ${t.status === 'Risolto' ? 'selected' : ''}>Risolto</option>
                                            </select>
                                          </td>
                                      </tr>
                                      `
                                  }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                // Esposizione funzione globale per il select
                window.updateTaskStatus = async (taskId, newStatus) => {
                    const db = await Database.getAll();
                    const task = db.tasks.find(t => t.id === taskId);
                    if(task) {
                        task.status = newStatus;
                        await Database.saveAll(db);
                        Toast.show("Stato aggiornato");
                        App.navigate('tasks'); // Ricarica la vista
                    }
                };
            },

            // -- IMPOSTAZIONI DATABASE E ADMIN --
            renderSettings(container, db) {
                const s = db.settings || {};
                container.innerHTML = `
                    <div class="mb-6">
                        <button onclick="App.navigate('dashboard')" class="text-sm text-slate-400 hover:text-white mb-2"><i class="fa-solid fa-arrow-left"></i> Torna alla Dashboard</button>
                        <h2 class="text-2xl font-bold">Impostazioni Database</h2>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-2xl">
                        <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-brands fa-github text-white"></i> Configurazione Cloud GitHub</h3>
                        <p class="text-sm text-slate-400 mb-6">Collega un repository GitHub per sincronizzare automaticamente i dati del gestionale in cloud ad ogni modifica.</p>
                        
                        <form id="frm-settings" class="space-y-4">
                            ${FormBuilder.createField({id: 'st-owner', label: 'GitHub Username (Owner)', type: 'text', placeholder: 'es. sergioyakh-jpg'})}
                            ${FormBuilder.createField({id: 'st-repo', label: 'Nome Repository', type: 'text', placeholder: 'es. mesa-fiber-db'})}
                            ${FormBuilder.createField({id: 'st-token', label: 'Personal Access Token (PAT)', type: 'password', placeholder: 'ghp_xxxxxxxxxxxx'})}
                            
                            <div class="pt-4 border-t border-slate-700 flex gap-3">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded font-bold transition">Salva e Testa Cloud</button>
                                <button type="button" onclick="Views.exportLocalBackup()" class="bg-slate-700 hover:bg-slate-600 px-6 py-2.5 rounded font-bold transition">Scarica Backup Locale (JSON)</button>
                            </div>
                        </form>
                    </div>
                `;

                // Popola i campi
                document.getElementById('st-owner').value = s.ghOwner || '';
                document.getElementById('st-repo').value = s.ghRepo || '';
                document.getElementById('st-token').value = s.ghToken || '';

                document.getElementById('frm-settings').onsubmit = async (e) => {
                    e.preventDefault();
                    const db = await Database.getAll();
                    if(!db.settings) db.settings = {};
                    db.settings.ghOwner = document.getElementById('st-owner').value.trim();
                    db.settings.ghRepo = document.getElementById('st-repo').value.trim();
                    db.settings.ghToken = document.getElementById('st-token').value.trim();
                    
                    await Database.saveAll(db);
                    Toast.show("Impostazioni salvate! Avvio sincronizzazione...", "success");
                };
            },

            exportLocalBackup() {
                const data = localStorage.getItem(Database.storageKey);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MESA_Backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            },

            // Oggetto contenitore per i Modali
            modals: {
                newTask(users) {
                    const techOptions = users.filter(u => u.role === 'Tecnico' || u.role === 'Manager').map(u => ({value: u.id, text: u.name}));
                    
                    const modalHtml = `
                        <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-lg shadow-2xl module-enter">
                                <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                                    <h3 class="font-bold text-lg">Nuova Pratica</h3>
                                    <button onclick="document.getElementById('modal-overlay').remove()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <form id="frm-new-task" class="p-6">
                                    ${FormBuilder.createField({id: 'nt-type', label: 'Tipo Intervento', type: 'select', options: [{value: 'Delivery', text:'Delivery (Attivazione)'}, {value: 'Assurance', text:'Assurance (Guasto)'}]})}
                                    ${FormBuilder.createField({id: 'nt-addr', label: 'Indirizzo Completo', type: 'text', placeholder: 'Via Roma 1, Modena'})}
                                    <div class="grid grid-cols-2 gap-4">
                                        ${FormBuilder.createField({id: 'nt-prio', label: 'Priorità', type: 'select', options: [{value: 'Bassa', text:'Bassa'}, {value: 'Media', text:'Media'}, {value: 'Alta', text:'Alta'}]})}
                                        ${FormBuilder.createField({id: 'nt-user', label: 'Assegna a', type: 'select', options: techOptions})}
                                    </div>
                                    ${FormBuilder.createField({id: 'nt-desc', label: 'Descrizione / Dettagli', type: 'textarea', placeholder: 'Dettagli intervento...'})}
                                    
                                    <button type="submit" class="w-full bg-blue-600 py-3 rounded font-bold mt-2">Crea e Assegna Pratica</button>
                                </form>
                            </div>
                        </div>
                    `;
                    document.body.insertAdjacentHTML('beforeend', modalHtml);

                    document.getElementById('frm-new-task').onsubmit = async (e) => {
                        e.preventDefault();
                        const db = await Database.getAll();
                        const newTask = {
                            id: `TSK-${Math.floor(Math.random() * 9000) + 1000}`,
                            type: document.getElementById('nt-type').value,
                            address: document.getElementById('nt-addr').value,
                            priority: document.getElementById('nt-prio').value,
                            assignedTo: document.getElementById('nt-user').value,
                            description: document.getElementById('nt-desc').value,
                            status: 'Aperto'
                        };
                        db.tasks.unshift(newTask);
                        await Database.saveAll(db);
                        document.getElementById('modal-overlay').remove();
                        Toast.show("Pratica creata con successo!");
                        App.navigate('tasks');
                    };
                }
            }
        };

        // Avvio Applicazione
        window.onload = () => {
            App.start();
        };
    </script>
</body>
</html>
