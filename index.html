<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MESA Fiber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgdark: '#0f172a',
                        tgcard: '#1e293b',
                        tgblue: '#3390ec'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-sky-500 selection:text-white">

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 font-bold">
                <i class="fa-solid fa-network-wired text-xs"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-tight text-white">MESA Fiber</h1>
                <p class="text-[10px] text-sky-400 font-medium">Field Manager</p>
            </div>
        </div>
        <div id="header-user-slot" class="flex items-center space-x-2"></div>
    </header>

    <main class="flex-grow max-w-2xl w-full mx-auto p-4 pb-28">
        <div id="app-view-container">
            <div class="flex flex-col items-center justify-center mt-24 space-y-3">
                <div class="w-8 h-8 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400">Avvio moduli in corso...</p>
            </div>
        </div>
    </main>

    <nav id="telegram-nav" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2.5 z-50 flex justify-between items-center max-w-2xl mx-auto md:rounded-t-2xl shadow-2xl">
        <button onclick="window.router('dashboard')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn" data-target="dashboard">
            <i class="fa-solid fa-chart-pie text-lg"></i>
            <span class="text-[10px] mt-0.5 font-medium">Home</span>
        </button>
        <button onclick="window.router('delivery')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn" data-target="delivery">
            <i class="fa-solid fa-screwdriver-wrench text-lg"></i>
            <span class="text-[10px] mt-0.5 font-medium">Delivery</span>
        </button>
        <button onclick="window.router('profile')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn" data-target="profile">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-0.5 font-medium">Profilo</span>
        </button>
        <button onclick="window.router('settings')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn" data-target="settings">
            <i class="fa-solid fa-gear text-lg"></i>
            <span class="text-[10px] mt-0.5 font-medium">Impostazioni</span>
        </button>
    </nav>

    <div id="global-modal-slot"></div>

    <script type="module" src="./modules/core.js"></script>
</body>
</html>
