<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MESA Fiber - WRM Workflow Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SUPABASE CLIENT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <meta name="theme-color" content="#030712">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mesa: {
                            dark: '#030712',
                            card: 'rgba(15, 23, 42, 0.65)',
                            border: 'rgba(56, 189, 248, 0.15)',
                            neon: '#0ea5e9',
                            glow: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Анимированный футуристичный фон с неоновыми сферами */
        .cyber-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
        }
        /* Эффект стекла */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-header {
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Неоновое свечение */
        .neon-glow {
            box-shadow: 0 0 25px -5px rgba(14, 165, 233, 0.25);
        }
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }
    </style>
</head>
<body class="cyber-bg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-sky-500 selection:text-white">

    <!-- HEADER WRM SYSTEM -->
    <header class="glass-header border-b border-slate-800/80 px-4 py-3.5 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold shadow-lg shadow-sky-500/10">
                <i class="fa-solid fa-network-wired text-sm animate-pulse"></i>
            </div>
            <div>
                <h1 class="font-black text-sm tracking-wider uppercase bg-gradient-to-r from-white via-slate-200 to-sky-400 bg-clip-text text-transparent">MESA Fiber</h1>
                <p id="header-subtitle" class="text-[10px] text-sky-400 font-semibold tracking-wide">WRM SYSTEM • MODENA</p>
            </div>
        </div>
        <div id="header-user-slot" class="flex items-center space-x-2"></div>
    </header>

    <!-- CONTENITORE PRINCIPALE DINAMICO -->
    <main class="flex-grow max-w-2xl w-full mx-auto p-4 pb-28">
        <div id="app-view">
            <div class="flex flex-col items-center justify-center mt-32 space-y-4">
                <div class="w-10 h-10 border-2 border-sky-500 border-t-transparent rounded-full animate-spin neon-glow"></div>
                <p class="text-xs text-sky-400 font-mono tracking-widest uppercase animate-pulse">Inizializzazione Reti MESA...</p>
            </div>
        </div>
    </main>

    <!-- MENU DI NAVIGAZIONE INFERIORE -->
    <nav id="telegram-nav" class="hidden fixed bottom-4 left-4 right-4 bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 px-4 py-3 z-50 flex justify-around items-center max-w-xl mx-auto rounded-2xl shadow-2xl neon-glow">
        <button onclick="window.appRouter('dashboard')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn group" data-target="dashboard">
            <i class="fa-solid fa-chart-pie text-lg group-hover:scale-110 transition"></i>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </button>
        <button onclick="window.appRouter('delivery')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn group" data-target="delivery">
            <i class="fa-solid fa-screwdriver-wrench text-lg group-hover:scale-110 transition"></i>
            <span class="text-[10px] mt-1 font-medium">Delivery</span>
        </button>
        <button id="admin-nav-btn" onclick="window.appRouter('admin')" class="hidden flex flex-col items-center py-1 px-3 text-slate-400 hover:text-amber-400 transition nav-btn group" data-target="admin">
            <i class="fa-solid fa-user-shield text-lg group-hover:scale-110 transition"></i>
            <span class="text-[10px] mt-1 font-medium">Admin & WRM</span>
        </button>
        <button onclick="window.appRouter('profile')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn group" data-target="profile">
            <i class="fa-solid fa-user text-lg group-hover:scale-110 transition"></i>
            <span class="text-[10px] mt-1 font-medium">Profilo</span>
        </button>
        <button onclick="window.appRouter('settings')" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-sky-400 transition nav-btn group" data-target="settings">
            <i class="fa-solid fa-gear text-lg group-hover:scale-110 transition"></i>
            <span class="text-[10px] mt-1 font-medium">Impostazioni</span>
        </button>
    </nav>

    <!-- SLOT MODALI GLOBALI -->
    <div id="global-modal-slot"></div>

    <!-- LOGICA APPLICATIVA -->
    <script>
        const SUPABASE_URL = 'https://aglxhsxzuohpqaqeitow.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1evuSLtiqGEBboDPek92Yw_ilaMFdKm';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let allTechnicians = [];

        async function initApp() {
            try {
                const { data, error } = await db.auth.getSession();
                if (error) throw error;
                
                const session = data.session;

                if (session) {
                    currentUser = session.user;
                    
                    let { data: profile, error: profileError } = await db.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
                    
                    if (!profile) {
                        const newProf = { id: currentUser.id, full_name: currentUser.email.split('@')[0], role: 'admin' };
                        await db.from('profiles').upsert(newProf);
                        profile = newProf;
                    }

                    currentProfile = profile || { full_name: currentUser.email, role: 'admin' };

                    await refreshTechniciansList();

                    document.getElementById('telegram-nav').classList.remove('hidden');
                    document.getElementById('admin-nav-btn').classList.remove('hidden');

                    renderHeaderUser();
                    window.appRouter('dashboard');
                } else {
                    renderLogin();
                }
            } catch (err) {
                console.error("Errore critico:", err);
                document.getElementById('app-view').innerHTML = `
                    <div class="max-w-sm mx-auto mt-20 glass-card border border-rose-500/30 p-6 rounded-3xl text-center shadow-2xl">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-rose-500 mb-3 animate-bounce"></i>
                        <h2 class="text-white font-bold text-sm">Errore di Sistema</h2>
                        <p class="text-xs text-slate-400 mt-2">Impossibile connettersi al database.</p>
                        <div class="mt-4 p-3 bg-slate-950/80 rounded-xl text-[10px] text-rose-400 font-mono break-words border border-slate-800">
                            ${err.message || err}
                        </div>
                    </div>
                `;
            }
        }

        async function refreshTechniciansList() {
            const { data: techs } = await db.from('profiles').select('*');
            allTechnicians = techs || [];
        }

        function renderHeaderUser() {
            const slot = document.getElementById('header-user-slot');
            if (!slot) return;
            const nameToShow = currentProfile.full_name || currentUser.email;
            const roleToShow = currentProfile.role || 'admin';
            slot.innerHTML = `
                <div class="flex items-center space-x-2 glass-card px-3.5 py-1.5 rounded-full shadow-lg border border-sky-500/20">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
                    <span class="text-xs font-semibold text-slate-200 hidden sm:inline">${nameToShow} <span class="text-sky-400 font-mono text-[10px]">(${roleToShow})</span></span>
                </div>
            `;
        }

        function renderLogin() {
            document.getElementById('telegram-nav').classList.add('hidden');
            document.getElementById('app-view').innerHTML = `
                <div class="max-w-sm mx-auto mt-20 glass-card p-8 rounded-3xl shadow-2xl border border-sky-500/20 neon-glow">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 rounded-2xl mx-auto flex items-center justify-center text-sky-400 text-2xl mb-3 shadow-lg">
                            <i class="fa-solid fa-fingerprint animate-pulse"></i>
                        </div>
                        <h2 class="text-xl font-black text-white tracking-wide">MESA Fiber WRM</h2>
                        <p class="text-xs text-slate-400 mt-1 font-mono">AUTenticazione operatore</p>
                    </div>
                    <form id="login-form" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1.5">Email</label>
                            <input type="email" id="l-email" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500 transition shadow-inner">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1.5">Password</label>
                            <input type="password" id="l-pass" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500 transition shadow-inner">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider uppercase transition shadow-lg shadow-sky-500/25 active:scale-95">
                            Accedi al Sistema
                        </button>
                        <p id="l-err" class="text-rose-400 text-xs text-center hidden mt-2 font-mono"></p>
                    </form>
                </div>
            `;

            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('l-email').value;
                const password = document.getElementById('l-pass').value;
                const errBox = document.getElementById('l-err');
                errBox.classList.add('hidden');

                const { error } = await db.auth.signInWithPassword({ email, password });
                if (!error) {
                    window.location.reload();
                } else {
                    errBox.textContent = "Credenziali errate o account inesistente.";
                    errBox.classList.remove('hidden');
                }
            };
        }

        window.appRouter = function(route) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.dataset.target;
                if(target === route) {
                    btn.classList.add('text-sky-400', 'scale-105');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-sky-400', 'scale-105');
                    btn.classList.add('text-slate-400');
                }
            });

            if (route === 'dashboard') renderDashboard();
            else if (route === 'delivery') renderDelivery();
            else if (route === 'admin') renderAdminPanel();
            else if (route === 'profile') renderProfile();
            else if (route === 'settings') renderSettings();
        };

        async function renderDashboard() {
            const container = document.getElementById('app-view');
            const welcomeName = currentProfile.full_name || currentUser.email;

            container.innerHTML = `
                <div class="space-y-5">
                    <div class="glass-card p-6 rounded-3xl shadow-xl flex justify-between items-center relative overflow-hidden border border-sky-500/20">
                        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div>
                            <span class="text-[10px] font-mono tracking-widest text-sky-400 uppercase">Dashboard Attiva</span>
                            <h2 class="text-xl font-black text-white mt-0.5">Benvenuto, ${welcomeName}</h2>
                            <p class="text-xs text-slate-400 mt-1">Workflow Management System • MESA Fiber</p>
                        </div>
                        <button onclick="window.appRouter('admin')" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black px-4 py-3 rounded-2xl text-xs transition shadow-lg shadow-amber-500/20 flex items-center space-x-2 active:scale-95">
                            <i class="fa-solid fa-plus"></i>
                            <span>Nuova Pratica</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-sky-500/30 transition group">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Assegnati</span>
                            <h3 id="stat-today" class="text-2xl font-black text-white mt-1 group-hover:text-sky-400 transition">-</h3>
                        </div>
                        <div class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-emerald-500/30 transition group">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Completati</span>
                            <h3 id="stat-done" class="text-2xl font-black text-emerald-400 mt-1">-</h3>
                        </div>
                        <div class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-amber-500/30 transition group">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Congelati</span>
                            <h3 id="stat-frozen" class="text-2xl font-black text-amber-400 mt-1">-</h3>
                        </div>
                        <div class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-sky-500/30 transition group">
                            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Totale</span>
                            <h3 id="stat-total" class="text-2xl font-black text-sky-400 mt-1">-</h3>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div onclick="window.appRouter('delivery')" class="glass-card p-5 rounded-3xl hover:border-sky-500/50 transition cursor-pointer flex items-center justify-between group">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-12 h-12 bg-sky-500/10 text-sky-400 rounded-2xl flex items-center justify-center text-xl group-hover:scale-110 transition border border-sky-500/20">
                                    <i class="fa-solid fa-screwdriver-wrench"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-sm">Delivery FTTH</h4>
                                    <p class="text-xs text-slate-400 mt-0.5">Interventi, misure OTDR e note</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-sky-400 transition text-sm"></i>
                        </div>

                        <div onclick="window.appRouter('admin')" class="glass-card p-5 rounded-3xl hover:border-amber-500/50 transition cursor-pointer flex items-center justify-between group">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-xl group-hover:scale-110 transition border border-amber-500/20">
                                    <i class="fa-solid fa-user-shield"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-sm">Pannello Admin & WRM</h4>
                                    <p class="text-xs text-slate-400 mt-0.5">Crea pratiche, assegna e gestisci</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-amber-400 transition text-sm"></i>
                        </div>
                    </div>
                </div>
            `;

            let query = db.from('interventions').select('*');
            const { data } = await query;
            if (data) {
                document.getElementById('stat-total').textContent = data.length;
                document.getElementById('stat-done').textContent = data.filter(i => i.status === 'completed').length;
                document.getElementById('stat-frozen').textContent = data.filter(i => i.status === 'frozen' || i.status === 'cancelled').length;
                document.getElementById('stat-today').textContent = data.filter(i => i.status === 'assigned').length;
            }
        }

        async function renderAdminPanel() {
            await refreshTechniciansList();

            const container = document.getElementById('app-view');
            const myId = currentUser.id;
            const myName = currentProfile.full_name || currentUser.email;

            let techOptionsHtml = `<option value="${myId}" class="bg-slate-900">-- Assegna a me (${myName}) --</option>`;
            allTechnicians.forEach(t => {
                if (t.id !== myId) {
                    const tName = t.full_name || t.id;
                    techOptionsHtml += `<option value="${t.id}" class="bg-slate-900">${tName} (${t.role})</option>`;
                }
            });

            container.innerHTML = `
                <div class="space-y-5">
                    <div class="glass-card p-6 rounded-3xl shadow-xl border border-sky-500/20">
                        <h2 class="text-sm font-black text-white mb-4 flex items-center tracking-wide uppercase">
                            <i class="fa-solid fa-plus-circle text-sky-400 mr-2.5 text-base"></i> Nuova Pratica FTTH & Assegnazione
                        </h2>
                        <form id="new-ticket-form" class="space-y-3.5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Nome Cliente</label>
                                    <input type="text" id="nt-client" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="Es. Rossi Mario">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Tipo Lavoro</label>
                                    <input type="text" id="nt-type" value="FTTH Installazione" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Indirizzo</label>
                                    <input type="text" id="nt-address" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="Via Emilia 10">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Città</label>
                                    <input type="text" id="nt-city" value="Modena" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Assegna Tecnico On-Field</label>
                                <select id="nt-technician" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                    ${techOptionsHtml}
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-xl text-xs tracking-wider uppercase transition shadow-lg shadow-sky-500/25 active:scale-95">
                                Crea e Invia Pratica nel Workflow
                            </button>
                        </form>
                    </div>

                    <div class="glass-card p-6 rounded-3xl shadow-xl space-y-4 border border-slate-800">
                        <h3 class="text-sm font-black text-white flex items-center uppercase tracking-wide">
                            <i class="fa-solid fa-list-check text-amber-400 mr-2.5 text-base"></i> Tutte le Pratiche nel WRM
                        </h3>
                        <div id="admin-tickets-list" class="space-y-3">
                            <p class="text-slate-500 text-xs text-center py-6 font-mono">Caricamento database...</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('new-ticket-form').onsubmit = async (e) => {
                e.preventDefault();
                const { error } = await db.from('interventions').insert([{
                    client_name: document.getElementById('nt-client').value,
                    work_type: document.getElementById('nt-type').value,
                    address: document.getElementById('nt-address').value,
                    city: document.getElementById('nt-city').value,
                    assigned_to: document.getElementById('nt-technician').value,
                    status: 'assigned'
                }]);

                if (!error) {
                    alert("Pratica creata con successo!");
                    renderAdminPanel();
                } else {
                    alert("Errore creazione: " + error.message);
                }
            };

            loadAdminTickets();
        }

        async function loadAdminTickets() {
            const { data } = await db.from('interventions').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('admin-tickets-list');
            if (!list) return;

            if (!data || data.length === 0) {
                list.innerHTML = `<p class="text-slate-500 text-xs text-center py-6 font-mono">Nessuna pratica trovata.</p>`;
                return;
            }

            list.innerHTML = data.map(t => {
                const assignedTech = allTechnicians.find(tc => tc.id === t.assigned_to);
                const techName = assignedTech ? (assignedTech.full_name || assignedTech.id) : 'Non assegnato';

                return `
                    <div class="bg-slate-950/70 border border-slate-800/80 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 hover:border-slate-700 transition">
                        <div>
                            <span class="text-[9px] font-mono uppercase bg-sky-500/10 text-sky-400 px-2.5 py-1 rounded-lg border border-sky-500/20">${t.status}</span>
                            <h4 class="font-bold text-white text-xs mt-2">${t.client_name} - <span class="text-slate-400 font-normal">${t.address}, ${t.city}</span></h4>
                            <p class="text-[11px] text-slate-400 mt-1">Assegnato a: <span class="text-amber-400 font-semibold">${techName}</span></p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="window.deleteTicket('${t.id}')" class="bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 text-rose-400 px-3 py-2 rounded-xl text-xs transition active:scale-95">
                                <i class="fa-solid fa-trash mr-1"></i> Elimina
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.deleteTicket = async function(id) {
            if (!confirm("Confermi l'eliminazione di questa pratica?")) return;
            const { error } = await db.from('interventions').delete().eq('id', id);
            if (!error) {
                loadAdminTickets();
            } else {
                alert("Errore eliminazione: " + error.message);
            }
        };

        async function renderDelivery() {
            const container = document.getElementById('app-view');
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="glass-card p-5 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-3 border border-sky-500/20">
                        <div>
                            <h2 class="text-sm font-black text-white flex items-center uppercase tracking-wide"><i class="fa-solid fa-screwdriver-wrench text-sky-400 mr-2.5"></i> Delivery FTTH</h2>
                            <p class="text-xs text-slate-400 mt-0.5">Interventi e note di squadra</p>
                        </div>
                        <div>
                            <select id="delivery-status-filter" class="bg-slate-950/90 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                <option value="all">Tutti gli stati</option>
                                <option value="assigned">Assegnati</option>
                                <option value="completed">Completati</option>
                                <option value="frozen">Congelati / Annullati</option>
                            </select>
                        </div>
                    </div>

                    <div id="delivery-tickets-list" class="space-y-3">
                        <p class="text-slate-500 text-xs text-center py-10 font-mono">Caricamento interventi in corso...</p>
                    </div>
                </div>
            `;

            document.getElementById('delivery-status-filter').onchange = (e) => loadTickets(e.target.value);
            loadTickets('all');
        }

        async function loadTickets(statusFilter) {
            let query = db.from('interventions').select('*').order('created_at', { ascending: false });
            if (statusFilter !== 'all') {
                query = query.eq('status', statusFilter);
            }

            const { data, error } = await query;
            const listContainer = document.getElementById('delivery-tickets-list');
            if (!listContainer) return;

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-slate-500 text-xs font-mono">Nessun intervento trovato.</div>`;
                return;
            }

            listContainer.innerHTML = data.map(t => {
                let badge = `<span class="bg-sky-500/10 text-sky-400 text-[10px] font-mono px-2.5 py-1 rounded-full border border-sky-500/20">Assegnato</span>`;
                if (t.status === 'completed') badge = `<span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-mono px-2.5 py-1 rounded-full border border-emerald-500/20">Completato</span>`;
                if (t.status === 'frozen') badge = `<span class="bg-amber-500/10 text-amber-400 text-[10px] font-mono px-2.5 py-1 rounded-full border border-amber-500/20">Congelato</span>`;
                if (t.status === 'cancelled') badge = `<span class="bg-rose-500/10 text-rose-400 text-[10px] font-mono px-2.5 py-1 rounded-full border border-rose-500/20">Annullato</span>`;

                const cleanClientName = (t.client_name || '').replace(/'/g, "");

                return `
                    <div class="glass-card p-5 rounded-3xl space-y-3.5 border border-slate-800 hover:border-sky-500/30 transition shadow-xl">
                        <div class="flex justify-between items-start">
                            <span class="text-[10px] font-mono uppercase bg-slate-950/80 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-800">${t.work_type}</span>
                            ${badge}
                        </div>
                        <div>
                            <h3 class="font-black text-white text-sm tracking-wide">${t.client_name}</h3>
                            <p class="text-xs text-slate-400 mt-1 flex items-center"><i class="fa-solid fa-location-dot mr-1.5 text-sky-400"></i> ${t.address}, ${t.city}</p>
                        </div>

                        <!-- SEZIONE NOTE -->
                        <div class="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800/80 space-y-2.5">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-sky-400 block"><i class="fa-solid fa-comments mr-1.5"></i> Note e Comunicazioni Squadra</span>
                            <div id="notes-box-${t.id}" class="text-xs text-slate-300 space-y-1.5 max-h-32 overflow-y-auto">
                                ${t.notes ? `<p class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">${t.notes}</p>` : `<p class="text-slate-500 italic text-[11px]">Nessuna nota lasciata.</p>`}
                            </div>
                            <div class="flex space-x-2 pt-1">
                                <input type="text" id="note-input-${t.id}" placeholder="Scrivi una nota per i colleghi..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                <button onclick="window.addColleagueNote('${t.id}')" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition active:scale-95 shadow-md">Invia</button>
                            </div>
                        </div>

                        ${t.status === 'completed' ? `
                            <div class="bg-slate-950/70 p-3.5 rounded-2xl text-xs space-y-1.5 text-slate-300 border border-emerald-500/20">
                                <p class="font-semibold text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i> Intervento Collaudato</p>
                                <p><strong>Potenze (1310/1490):</strong> ${t.pwr_1310} /${t.pwr_1490} dBm</p>
                                <p><strong>OTDR:</strong> <span class="text-sky-400 font-bold">${t.otdr_result}</span> \vert{} <strong>Porta:</strong>${t.port_code}</p>
                            </div>
                        ` : t.status === 'frozen' || t.status === 'cancelled' ? `` : `
                            <div class="flex space-x-2.5 pt-1">
                                <button onclick="window.openCloseModal('${t.id}', '${cleanClientName}')" class="flex-1 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-500/20 active:scale-95">
                                    Chiudi Lavoro (OTDR / Potenze)
                                </button>
                                <button onclick="window.openFreezeModal('${t.id}', '${cleanClientName}')" class="bg-slate-950 border border-slate-800 hover:border-rose-500/50 text-rose-400 px-4 py-2.5 rounded-xl text-xs transition active:scale-95">
                                    <i class="fa-solid fa-ban"></i>
                                </button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        window.addColleagueNote = async function(ticketId) {
            const input = document.getElementById(`note-input-${ticketId}`);
            if (!input) return;
            const noteText = input.value.trim();
            if (!noteText) return;

            const formattedNote = `[${currentProfile.full_name || currentUser.email}]: ${noteText}`;
            const { data: ticket } = await db.from('interventions').select('notes').eq('id', ticketId).single();
            const existingNotes = ticket && ticket.notes ? ticket.notes : '';
            const updatedNotes = existingNotes ? `${existingNotes}\n${formattedNote}` : formattedNote;

            const { error } = await db.from('interventions').update({ notes: updatedNotes }).eq('id', ticketId);
            if (!error) {
                input.value = '';
                loadTickets('all');
            } else {
                alert("Errore invio nota: " + error.message);
            }
        };

        window.openCloseModal = function(id, name) {
            document.getElementById('global-modal-slot').innerHTML = `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                    <div class="glass-card rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto border border-sky-500/30 neon-glow">
                        <h3 class="text-sm font-black text-white mb-1 uppercase tracking-wider">Chiusura Lavoro FTTH</h3>
                        <p class="text-xs text-slate-400 mb-4 font-mono">Cliente: ${name}</p>
                        <form id="close-form" class="space-y-3.5">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">1310 nm (dBm)</label>
                                    <input type="text" id="cf-1310" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="-20.5">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">1490 nm (dBm)</label>
                                    <input type="text" id="cf-1490" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="-18.2">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Esito OTDR</label>
                                <select id="cf-otdr" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                    <option value="Pass">PASS (Conforme)</option>
                                    <option value="Fail">FAIL (Anomalia)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Codice PFP / Porta</label>
                                <input type="text" id="cf-port" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="PFP-01-04">
                            </div>
                            <div class="flex space-x-2.5 pt-2">
                                <button type="button" onclick="window.closeModal()" class="w-1/2 bg-slate-950 border border-slate-800 text-slate-300 font-bold py-3 rounded-xl text-xs transition active:scale-95">Annulla</button>
                                <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/30 transition active:scale-95">Salva Chiusura</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('close-form').onsubmit = async (e) => {
                e.preventDefault();
                const { error } = await db.from('interventions').update({
                    status: 'completed',
                    pwr_1310: document.getElementById('cf-1310').value,
                    pwr_1490: document.getElementById('cf-1490').value,
                    otdr_result: document.getElementById('cf-otdr').value,
                    port_code: document.getElementById('cf-port').value,
                    closed_at: new Date().toISOString()
                }).eq('id', id);

                if (!error) {
                    window.closeModal();
                    renderDelivery();
                } else {
                    alert("Errore salvataggio: " + error.message);
                }
            };
        };

        window.openFreezeModal = function(id, name) {
            document.getElementById('global-modal-slot').innerHTML = `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                    <div class="glass-card rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-rose-500/30">
                        <h3 class="text-sm font-black text-rose-400 mb-1 uppercase tracking-wider">Blocco / Congelamento</h3>
                        <p class="text-xs text-slate-400 mb-4 font-mono">Cliente: ${name}</p>
                        <form id="freeze-form" class="space-y-3.5">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Azione</label>
                                <select id="ff-status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                                    <option value="frozen">Congela (Sospesa)</option>
                                    <option value="cancelled">Annulla Intervento</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Motivazione</label>
                                <textarea id="ff-notes" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition" placeholder="Es. Cliente irreperibile..."></textarea>
                            </div>
                            <div class="flex space-x-2.5 pt-2">
                                <button type="button" onclick="window.closeModal()" class="w-1/2 bg-slate-950 border border-slate-800 text-slate-300 font-bold py-3 rounded-xl text-xs transition active:scale-95">Indietro</button>
                                <button type="submit" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-rose-600/30 transition active:scale-95">Conferma</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('freeze-form').onsubmit = async (e) => {
                e.preventDefault();
                const { error } = await db.from('interventions').update({
                    status: document.getElementById('ff-status').value,
                    notes: document.getElementById('ff-notes').value,
                    closed_at: new Date().toISOString()
                }).eq('id', id);

                if (!error) {
                    window.closeModal();
                    renderDelivery();
                } else {
                    alert("Errore: " + error.message);
                }
            };
        };

        window.closeModal = function() {
            document.getElementById('global-modal-slot').innerHTML = '';
        };

        function renderProfile() {
            document.getElementById('app-view').innerHTML = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="glass-card p-8 rounded-3xl shadow-xl text-center border border-sky-500/20">
                        <div class="w-20 h-20 bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 text-sky-400 rounded-3xl mx-auto flex items-center justify-center text-3xl mb-4 font-black shadow-lg">
                            ${currentProfile.full_name ? currentProfile.full_name[0].toUpperCase() : 'U'}
                        </div>
                        <h2 class="text-lg font-black text-white tracking-wide">${currentProfile.full_name || currentUser.email}</h2>
                        <p class="text-xs text-slate-400 mt-0.5 font-mono">${currentUser.email}</p>
                        <span class="inline-block mt-3 bg-sky-500/10 text-sky-400 text-[10px] font-mono px-3 py-1 rounded-full uppercase border border-sky-500/20">${currentProfile.role}</span>
                    </div>

                    <div class="glass-card p-5 rounded-3xl shadow-xl space-y-3 border border-slate-800">
                        <h3 class="text-xs font-bold text-white uppercase tracking-wider">Sessione</h3>
                        <button onclick="window.doLogout()" class="w-full bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 font-bold py-3.5 rounded-2xl text-xs transition active:scale-95">
                            Disconnetti Account
                        </button>
                    </div>
                </div>
            `;

            window.doLogout = async () => {
                await db.auth.signOut();
                window.location.reload();
            };
        }

        function renderSettings() {
            document.getElementById('app-view').innerHTML = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="glass-card p-6 rounded-3xl shadow-xl border border-sky-500/20">
                        <h2 class="text-sm font-black text-white mb-4 uppercase tracking-wider flex items-center"><i class="fa-solid fa-gear text-sky-400 mr-2.5"></i> Impostazioni Personali</h2>
                        
                        <form id="settings-form" class="space-y-3.5">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Nome Completo</label>
                                <input type="text" id="st-name" value="${currentProfile.full_name || ''}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-sky-400 mb-1">Nuova Password (opzionale)</label>
                                <input type="password" id="st-pass" placeholder="Minimo 6 caratteri" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 transition">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-500/20 active:scale-95">
                                Salva Modifiche
                            </button>
                            <p id="ts-msg" class="text-emerald-400 text-xs text-center hidden mt-2 font-mono">Modifiche salvate con successo!</p>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('settings-form').onsubmit = async (e) => {
                e.preventDefault();
                const newName = document.getElementById('st-name').value.trim();
                const newPass = document.getElementById('st-pass').value;

                const { error } = await db.from('profiles').upsert({
                    id: currentUser.id,
                    full_name: newName,
                    role: currentProfile.role
                });

                if (!error) {
                    currentProfile.full_name = newName;
                    renderHeaderUser();
                    
                    if (newPass && newPass.trim().length >= 6) {
                        await db.auth.updateUser({ password: newPass });
                    }

                    const msg = document.getElementById('ts-msg');
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                } else {
                    alert("Errore salvataggio: " + error.message);
                }
            };
        }

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
